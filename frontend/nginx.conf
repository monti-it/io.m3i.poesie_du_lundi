# Link-unfurling bots (Twitter/X, Facebook, Slack, Discord, …) read OpenGraph/Twitter meta tags
# straight out of the initial HTML and never execute JS, so the SPA's React-hoisted per-poem tags
# (docs/ARCHITECTURE.md "Feeds & SEO") never reach them. Google/Bing render JS before indexing and
# are deliberately left off this list, so they keep getting the real SPA. Matched against the
# well-known unfurl-bot User-Agent substrings (issue #83).
map $http_user_agent $unfurl_bot {
    default 0;
    "~*facebookexternalhit|Twitterbot|Slackbot|TelegramBot|Discordbot|LinkedInBot|WhatsApp|SkypeUriPreview|redditbot|Pinterest" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt and sitemap.xml are only honoured at the document root, so the API serves them
    # there directly (PublicSeoEndpoints) rather than under /api — proxied the same way.
    location = /robots.txt {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's build hashes every filename under /assets, so these are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A single poem, requested by an unfurl bot (see the $unfurl_bot map above): rewritten to the
    # API's server-rendered OG/Twitter HTML (PublicPoemEndpoints, issue #83) instead of the SPA.
    # Everyone else — real browsers, Googlebot — falls through to the ordinary SPA route below.
    location ~ ^/poems/(?<poem_slug>[^/]+)/?$ {
        if ($unfurl_bot) {
            rewrite ^ /api/poems/$poem_slug/unfurl last;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback for both the public site (/) and the admin app (/admin) — a single
    # catch-all, since neither has a matching static file for its client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
