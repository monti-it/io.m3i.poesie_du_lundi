apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poesie-db
  namespace: poesie
spec:
  serviceName: poesie-db
  replicas: 1
  selector:
    matchLabels:
      app: poesie-db
  template:
    metadata:
      labels:
        app: poesie-db
    spec:
      containers:
        - name: db
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: poesie-db-credentials
          volumeMounts:
            # Postgres 18 mounts the volume at /var/lib/postgresql, NOT the pre-18
            # /var/lib/postgresql/data — crash-loops otherwise.
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "poesie"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "poesie"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: poesie-db
  namespace: poesie
spec:
  clusterIP: None
  selector:
    app: poesie-db
  ports:
    - port: 5432
      targetPort: 5432
