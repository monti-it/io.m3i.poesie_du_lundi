apiVersion: apps/v1
kind: Deployment
metadata:
  name: poesie-frontend
  namespace: poesie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poesie-frontend
  template:
    metadata:
      labels:
        app: poesie-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/monti-it/io.m3i.poesie_du_lundi-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poesie-frontend
  namespace: poesie
spec:
  selector:
    app: poesie-frontend
  ports:
    - port: 80
      targetPort: 80
