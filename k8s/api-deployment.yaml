apiVersion: apps/v1
kind: Deployment
metadata:
  name: poesie-api
  namespace: poesie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poesie-api
  template:
    metadata:
      labels:
        app: poesie-api
    spec:
      initContainers:
        # Applies pending EF Core migrations before the app container starts, as an ordered
        # pre-serving step (old pods keep serving the pre-migration schema until this succeeds;
        # a failed migration exits non-zero and blocks the rollout). Same image as the app
        # container — CI pins both to the commit SHA on each deploy.
        - name: migrate
          image: ghcr.io/monti-it/io.m3i.poesie_du_lundi-api:latest
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: poesie-api-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: api
          image: ghcr.io/monti-it/io.m3i.poesie_du_lundi-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: poesie-api-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poesie-api
  namespace: poesie
spec:
  selector:
    app: poesie-api
  ports:
    - port: 80
      targetPort: 8080
